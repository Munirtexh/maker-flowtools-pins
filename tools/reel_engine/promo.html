<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0a0720;font-family:'Inter Display','Inter','Noto Color Emoji',sans-serif;color:#fff}
#stage{position:absolute;inset:0;overflow:hidden;background:radial-gradient(circle at 50% 40%,#3a1070 0%,#150a38 55%,#07041a 100%)}
.abs{position:absolute}
#rays{position:absolute;left:-600px;top:-300px;width:2280px;height:2280px;background:repeating-conic-gradient(from 0deg,rgba(255,64,110,.20) 0 7deg,rgba(255,64,110,0) 7deg 15deg);border-radius:50%}
#flash{position:absolute;inset:0;background:#ffd23d;opacity:0;z-index:90}
.top{position:absolute;left:0;right:0;text-align:center;font-weight:900;letter-spacing:-1px}
#cyber{top:130px;font-size:104px;line-height:1;transform-origin:50% 50%}
#cyber span{background:linear-gradient(90deg,#ff2d6f,#ff9f1c);padding:10px 36px;border-radius:26px;display:inline-block;box-shadow:0 0 70px rgba(255,45,111,.7)}
#big{top:360px;font-size:330px;line-height:1;letter-spacing:-10px;color:#ffd23d;text-shadow:0 0 90px rgba(255,210,61,.75),0 14px 0 #c2410c;transform-origin:50% 50%}
#sub{top:760px;font-size:96px;line-height:1.02;transform-origin:50% 50%}
#sub b{color:#2ee6a6}
#bubble{position:absolute;left:560px;top:880px;max-width:440px;background:#fff7d6;color:#1a1033;border-radius:40px;padding:26px 34px;font-size:54px;font-weight:900;line-height:1.05;transform-origin:10% 100%;z-index:30}
#bubble:after{content:"";position:absolute;left:30px;bottom:-30px;border:22px solid transparent;border-top:34px solid #fff7d6;border-bottom:0}
#man{position:absolute;left:0;top:0;width:1080px;height:1920px;z-index:20}
.card{position:absolute;width:800px;height:150px;border-radius:34px;background:linear-gradient(160deg,#1b1f55,#101436);border:3px solid rgba(255,255,255,.14);padding:22px 36px;z-index:25;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.card .nm{font-size:54px;font-weight:900;line-height:1.05}
.card .sb{font-size:28px;color:#9fb0ff;font-weight:700;margin-top:6px}
.card .bars{display:none;position:absolute;right:230px;top:22px;gap:10px;align-items:flex-end;height:100px}
.card .bars i{display:block;width:22px;border-radius:8px}
.card .off{position:absolute;right:-16px;top:28px;background:#ff2d6f;color:#fff;font-weight:900;font-size:58px;padding:12px 26px;border-radius:20px;transform:rotate(8deg);box-shadow:0 10px 30px rgba(255,45,111,.6)}
.card .was{position:absolute;right:30px;bottom:26px;font-size:34px;font-weight:900;color:#ffd23d;text-align:right}
.card .was s{color:#ff7a90;font-size:28px;opacity:.9}
#limited{position:absolute;left:60px;right:60px;top:1420px;z-index:30;text-align:center}
#limited .t{font-size:56px;font-weight:900;letter-spacing:1px}
#limited .bar{margin:18px auto 0;width:760px;height:30px;border-radius:20px;background:rgba(255,255,255,.14);overflow:hidden}
#limited .bar i{display:block;height:100%;background:linear-gradient(90deg,#ff2d6f,#ffd23d);border-radius:20px}
#cta{position:absolute;left:40px;right:40px;top:760px;text-align:center;z-index:40;transform-origin:50% 50%}
#cta .b{display:inline-block;background:linear-gradient(90deg,#2ee6a6,#5cc8ff);color:#06122b;font-weight:900;font-size:92px;padding:26px 60px;border-radius:60px;box-shadow:0 0 80px rgba(46,230,166,.6)}
#cta .s{margin-top:34px;font-size:50px;font-weight:800;color:#cfd8ff}
#shop{position:absolute;left:0;right:0;bottom:70px;text-align:center;font-size:36px;font-weight:800;letter-spacing:6px;color:#9fb0ff;z-index:30;text-transform:uppercase}
.coin{position:absolute;font-size:70px;z-index:22}

.mq{position:absolute;left:-40px;right:-40px;height:72px;background:#ffd23d;color:#1a0a3a;font-weight:900;font-size:40px;letter-spacing:3px;white-space:nowrap;overflow:hidden;z-index:70;display:flex;align-items:center;transform:rotate(0deg)}
.mq div{position:absolute;left:0;white-space:nowrap}
#mqt{top:0}#mqb{bottom:0;background:#ff2d6f;color:#fff}
#frame{position:absolute;inset:84px 14px 84px 14px;border-radius:44px;border:6px solid #ff2d6f;z-index:65;pointer-events:none}
.cf{position:absolute;width:18px;height:34px;border-radius:4px;z-index:21;top:0;left:0}
.shine{position:absolute;top:-10px;bottom:-10px;width:120px;background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.55),rgba(255,255,255,0));transform:skewX(-20deg);border-radius:20px}
.card{overflow:visible}
.card .clip{position:absolute;inset:0;overflow:hidden;border-radius:34px;pointer-events:none}
#cd{position:absolute;left:0;right:0;top:1395px;z-index:30;text-align:center}
#cd .lab{font-size:54px;font-weight:900;color:#ffd23d;letter-spacing:2px;margin-bottom:16px}
#cd .row{display:flex;gap:18px;justify-content:center}
#cd .bx{width:190px;border-radius:26px;background:linear-gradient(180deg,#2a1560,#150a38);border:3px solid #ff2d6f;padding:12px 0 10px;box-shadow:0 0 40px rgba(255,45,111,.55)}
#cd .bx b{display:block;font-size:92px;line-height:1;font-variant-numeric:tabular-nums;color:#fff}
#cd .bx span{font-size:26px;font-weight:800;color:#ff9fb7;letter-spacing:3px}
#tag{position:absolute;left:560px;top:640px;font-size:300px;z-index:26;transform-origin:50% 0}
#tagt{position:absolute;font-size:70px;font-weight:900;color:#ff2d6f;left:0;right:0;top:150px;text-align:center}
#end{margin-top:26px;font-size:60px;font-weight:900;color:#ffd23d}
</style>
</head><body>
<div id="stage">
<div id="rays"></div>
<div class="top" id="cyber"><span id="cybertxt"></span></div>
<div class="top" id="big">-30%</div>
<div class="top" id="sub"></div>
<svg id="man" viewBox="0 0 1080 1920"></svg>
<div id="bubble"></div>
<div id="limited" style="display:none"><div class="t"></div><div class="bar"><i></i></div></div>
<div id="cta"><div class="b"></div><div class="s"></div><div id="end"></div></div>
<div id="shop" style="display:none"></div><div class="mq" id="mqt"><div></div></div><div class="mq" id="mqb"><div></div></div><div id="frame"></div><div id="tag">🏷️<div id="tagt">-30%</div></div><div id="cd"></div>
<div id="flash"></div>
</div>
<script>
const $=s=>document.querySelector(s);
let C,EV=[],A=[],DUR=15;
const ev=(t,type)=>EV.push({t,type});
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
const back=x=>{x=clamp(x);const c=2.2;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const rnd=(i)=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)};
function pop(el,t,a,dur=.45,rot=0){const k=back((t-a)/dur);el.style.opacity=t<a?0:1;el.style.transform=`scale(${t<a?0:k}) rotate(${rot*(1-clamp((t-a)/dur))}deg)`}
// stickman
function man(t,pose,x,y,s){ // pose: 'cheer' | 'run' | 'shock'
  const w=14,ph=t*(pose==='run'?14:6);
  const bob=pose==='cheer'?Math.abs(Math.sin(t*7))*-70:(pose==='run'?Math.abs(Math.sin(ph))*-22:0);
  const hx=x,hy=y-250+bob,bx=x,by=y-170+bob,ph2=bob;
  let aL,aR,lL,lR;
  if(pose==='cheer'){const f=Math.sin(t*14)*30;aL=[x-120,y-330+bob+f];aR=[x+120,y-330+bob-f];lL=[x-50,y+(bob*-.0)+ (Math.sin(t*7)>0?0:0)];lR=[x+50,y]}
  else if(pose==='run'){const s2=Math.sin(ph);aL=[x-90*s2-20,y-110+bob];aR=[x+90*s2+20,y-110+bob];lL=[x+90*s2,y];lR=[x-90*s2,y]}
  else{aL=[x-110,y-90];aR=[x+110,y-90];lL=[x-40,y];lR=[x+40,y]}
  const hips=[x,y-60+bob*.5];
  const L=(a,b)=>`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/>`;
  const mouth=pose==='shock'?`<ellipse cx="${hx}" cy="${hy+22}" rx="14" ry="20" fill="#fff" stroke="none"/>`:`<path d="M${hx-22} ${hy+14} Q${hx} ${hy+46} ${hx+22} ${hy+14}" fill="none"/>`;
  const eyes=`<circle cx="${hx-20}" cy="${hy-10}" r="7" fill="#fff" stroke="none"/><circle cx="${hx+20}" cy="${hy-10}" r="7" fill="#fff" stroke="none"/>`;
  const cart=pose==='run'?`<g stroke="#ffd23d" stroke-width="12" fill="none"><path d="M${x+110} ${y-190} h200 l-30 150 h-150 z"/><circle cx="${x+160}" cy="${y-8}" r="20" fill="#ffd23d"/><circle cx="${x+260}" cy="${y-8}" r="20" fill="#ffd23d"/><line x1="${aR[0]}" y1="${aR[1]}" x2="${x+110}" y2="${y-190}"/></g><text x="${x+170}" y="${y-215+Math.sin(t*10)*10}" font-size="80">🛍️</text>`:'';
  return `<g transform="translate(${x} ${y}) scale(${s}) translate(${-x} ${-y})"><g stroke="#fff" stroke-width="${w}" stroke-linecap="round" fill="none"><circle cx="${hx}" cy="${hy}" r="62" fill="#0a0720"/>${L([bx,by],hips)}${L([bx,by+20],aL)}${L([bx,by+20],aR)}${L(hips,lL)}${L(hips,lR)}</g>${eyes}${mouth}${cart}</g>`;
}
function init(cfg){C=cfg;DUR=cfg.dur||15;const T=cfg.t;
  $('#cybertxt').textContent=T.cyber;$('#sub').innerHTML=T.sub;$('#bubble').innerHTML=T.bubble;
  $('#limited .t').textContent=T.limited;$('#cta .b').textContent=T.cta;$('#cta .s').textContent=T.ctaSub;
  const items=T.items,cards=[];
  items.forEach((it,i)=>{const d=document.createElement('div');d.className='card';
    d.innerHTML=`<div class="nm">${it[0]}</div><div class="sb">${it[1]}</div><div class="bars">${[.5,.8,.35,.95,.65].map((h,j)=>`<i style="height:${h*100}px;background:${['#2ee6a6','#5cc8ff','#ffd23d','#ff5d73','#b388ff'][(i+j)%5]}"></i>`).join('')}</div><div class="off">-30%</div><div class="clip"><div class="shine"></div></div>`;
    $('#stage').appendChild(d);cards.push(d);});
  const coins=[];for(let i=0;i<14;i++){const c=document.createElement('div');c.className='coin';c.textContent=['💸','🔥','⚡','💰'][i%4];$('#stage').appendChild(c);coins.push(c);}
  const cardT=[6.0,7.3,8.6,9.9,11.2];
  ev(0.05,'impact');ev(0.9,'whoosh');ev(1.6,'stamp');ev(2.9,'whoosh');ev(3.3,'pop');
  cardT.forEach(a=>{ev(a,'stamp');ev(a+.05,'pop')});ev(12.2,'riser');ev(13.0,'ding');
  for(let a=.4;a<13;a+=.7)ev(a,'tick');
  A.push(t=>{ // background
    $('#rays').style.transform=`rotate(${t*14}deg)`;$('#rays').style.opacity=.7+.3*Math.sin(t*6);
    const f=[0,2.9,5.9,12.9].map(a=>Math.max(0,1-(t-a)*6)*(t>=a?1:0)).reduce((x,y)=>Math.max(x,y));$('#flash').style.opacity=f*.45;
  });
  A.push(t=>{ // hook 0-3.6 : CYBER SALE / -30% / sur tout
    const cy=$('#cyber');cy.style.transform=`scale(${t<.3?1+(.3-t)*.5:1}) rotate(${Math.sin(t*20)*(t<3?1.2:0)}deg)`;
    const big=$('#big');
    const sh=t<3?Math.sin(t*38)*(t<.5?14:4):0;
    let sc=1,top=300;
    if(t<.35)sc=1+(.35-t)*.4; else if(t<3)sc=1+.04*Math.sin(t*9);
    if(t>=3){const k=ease((t-3)/.7);sc=1-.42*k;top=330-70*k}
    big.style.transform=`translate(${sh}px,0) scale(${sc})`;big.style.top=top+'px';
    const sub=$('#sub');if(t<3.0){sub.style.opacity=1;sub.style.transform=`scale(${1+.03*Math.sin(t*8)})`}else{sub.style.opacity=clamp(1-(t-3)*4);}
  });
  A.push(t=>{ // man + bubble
    let pose,x,y,s=1;
    if(t<3.0){pose=null}else if(t<6){pose='shock';x=300;y=1500;s=1.5}
    else if(t<12.4){pose='run';x=300+((t-6)*20)%0;y=1790;s=.6}
    else{pose='cheer';x=300;y=1560;s=.8}
    const svg=$('#man');
    if(!pose||t>=12.4&&false){svg.innerHTML=''}else svg.innerHTML=man(t,pose,pose==='run'?160:(pose==='cheer'?190:340),y,s);
    if(t>=12.4)svg.innerHTML=man(t,'cheer',300,1780,1.15);
    const b=$('#bubble');
    if(t>=3.3&&t<5.9){b.style.top='1000px';b.style.left='520px';pop(b,t,3.3,.4,-6)}else b.style.opacity=0;
  });
  cards.forEach((d,i)=>{const a=cardT[i];A.push(t=>{
    const side=i%2?1:-1,slots=[0,1,2,3,4].map(j=>[140,560+j*165]);
    const ex=slots[i][0],ey=slots[i][1];
    if(t<a){d.style.opacity=0;return}
    const k=back((t-a)/.5);
    const hide=t>12.3?clamp(1-(t-12.3)*5):1;
    d.style.opacity=hide;
    const tilt=(i%2?-7:7);
    d.style.left=ex+'px';d.style.top=ey+'px';
    d.style.transform=`translate(${(1-k)*side*900}px,0) rotate(${tilt*.45*k}deg) scale(${.9+.1*k})`;
  })});
  const T2=cfg.t;
  const mqs=Array(8).fill(T2.mq).join('  ★  ');$('#mqt div').textContent=mqs;$('#mqb div').textContent=mqs;
  const cfs=[];for(let i=0;i<46;i++){const c=document.createElement('div');c.className='cf';c.style.background=['#ffd23d','#ff2d6f','#2ee6a6','#5cc8ff','#b388ff'][i%5];$('#stage').appendChild(c);cfs.push(c);}
  const cdEl=$('#cd');cdEl.innerHTML=`<div class="lab">${T2.limited}</div><div class="row">${['d','h','m','s'].map((k,j)=>`<div class="bx"><b id="cd${k}">00</b><span>${T2.units[j]}</span></div>`).join('')}</div>`;
  $('#end').textContent=T2.end;
  A.push(t=>{ // marquee, frame, confetti, punch
    $('#mqt div').style.transform=`translateX(${-(t*260)%1500}px)`;$('#mqb div').style.transform=`translateX(${-1500+(t*260)%1500}px)`;
    const fr=$('#frame');const h=(t*120)%360;fr.style.borderColor=`hsl(${330+Math.sin(t*3)*40},100%,60%)`;fr.style.boxShadow=`0 0 ${30+20*Math.sin(t*8)}px hsl(${330+Math.sin(t*3)*40},100%,60%), inset 0 0 ${30+20*Math.sin(t*8)}px hsl(${330+Math.sin(t*3)*40},100%,60%)`;
    cfs.forEach((c,i)=>{const sp=.35+rnd(i)*.5,ph=rnd(i+50);const u=((t*sp+ph)%1);c.style.left=(rnd(i+7)*1040+Math.sin(t*2+i)*40)+'px';c.style.top=(u*2000-60)+'px';c.style.transform=`rotate(${t*200*(rnd(i+3)-.5)+i*40}deg) scaleY(${.4+Math.abs(Math.sin(t*5+i))*.6})`;c.style.opacity=t<0?0:.95});
    let p=0;[0,2.9,...cardT,12.6].forEach(a=>{const u=t-a;if(u>=0&&u<.25)p=Math.max(p,1-u/.25)});
    $('#stage').style.transform=`scale(${1+.035*p})`;
    // glitch big
    const g=(t<1.2||(t%2.2)<.18)?1:0;const o=g*(8+6*Math.sin(t*60));
    $('#big').style.textShadow=`${-o}px 0 0 rgba(0,255,240,.85),${o}px 0 0 rgba(255,0,110,.85),0 0 90px rgba(255,210,61,.75),0 14px 0 #c2410c`;
  });
  A.push(t=>{ // shine sweep on cards
    cards.forEach((d,i)=>{const sh=d.querySelector('.shine');const u=((t-cardT[i]-.5)%2.2);sh.style.left=(u<0?-200:(u*900-200))+'px'});
  });
  A.push(t=>{ // swinging tag 3-5.9
    const g=$('#tag');if(t<3.1||t>=5.9){g.style.opacity=0;return}
    const k=back((t-3.1)/.5);g.style.opacity=1;g.style.transform=`scale(${k}) rotate(${Math.sin(t*5)*14}deg)`;
  });
  A.push(t=>{ // countdown 5.9-12.5
    const el=$('#cd');if(t<5.9||t>=12.5){el.style.opacity=0;return}
    const k=back((t-5.9)/.4);el.style.opacity=1;el.style.transform=`scale(${k*(1+.02*Math.sin(t*10))})`;
    const total=T2.days*86400+5*3600+29*60+30-Math.floor((t-5.9)*1);
    // fast visual tick: seconds run down 7x speed
    const tot=T2.days*86400+5*3600+29*60+30-Math.floor((t-5.9)*7);
    const d=Math.floor(tot/86400),h=Math.floor(tot%86400/3600),m=Math.floor(tot%3600/60),sc=tot%60;
    const f=n=>String(n).padStart(2,'0');
    $('#cdd').textContent=f(d);$('#cdh').textContent=f(h);$('#cdm').textContent=f(m);$('#cds').textContent=f(sc);
  });
  A.push(t=>{ // limited bar
    const el=$('#limited');el.style.opacity=(t>5.4&&t<12.4)?1:0;
    el.querySelector('.t').textContent=T.limited;
    el.querySelector('i').style.width=(100-clamp((t-5.4)/7,0,1)*88)+'%';
    el.style.transform=`scale(${1+.03*Math.sin(t*10)})`;
  });
  A.push(t=>{ // coins burst while cards land
    coins.forEach((c,i)=>{const a=cardT[i%5]+.05;const u=t-a;if(u<0||u>1.4){c.style.opacity=0;return}
      c.style.opacity=1-u/1.4;const ang=rnd(i)*6.28;const r=u*(300+rnd(i+9)*300);
      c.style.left=(540+Math.cos(ang)*r)+'px';c.style.top=(900+Math.sin(ang)*r-u*100)+'px';});
  });
  A.push(t=>{ // CTA
    const c=$('#cta');if(t<12.6){c.style.opacity=0;return}
    const k=back((t-12.6)/.5);c.style.opacity=1;c.style.transform=`scale(${k*(1+.04*Math.sin(t*9))})`;
    const bigs=$('#big');
    
  });
  A.push(t=>{ // shop tag + cyber label stay
    $('#shop').style.opacity=(t>2.9&&(t<5.4||t>12.6))?1:0;
  });
  window.EVENTS=EV.sort((a,b)=>a.t-b.t);return {dur:DUR,events:window.EVENTS};}
function render(t){A.forEach(f=>f(t));}
</script></body></html>
