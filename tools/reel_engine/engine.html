<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0b0f1e;font-family:'Inter Display','Inter','Noto Color Emoji',sans-serif;color:#fff}
#stage{position:absolute;inset:0;overflow:hidden}
.abs{position:absolute}
.blob{position:absolute;border-radius:50%}
.dot{position:absolute;border-radius:50%}
#brand{position:absolute;top:84px;left:72px;right:72px;display:flex;justify-content:space-between;align-items:center;font-weight:800;letter-spacing:5px;font-size:24px;text-transform:uppercase}
#brand .l{display:flex;align-items:center;gap:16px}
#brand .tag{padding:10px 20px;border-radius:40px;background:rgba(255,255,255,.1);letter-spacing:3px;font-size:21px}
#hook{position:absolute;left:50px;right:50px;text-align:center;font-weight:900;line-height:1.04;letter-spacing:-2px;transform-origin:50% 50%}
.w{display:inline-block;margin:0 .11em;transform-origin:50% 85%;position:relative}
.hl{color:var(--a1)}
.mk{position:absolute;left:-.08em;right:-.08em;bottom:.02em;height:.32em;background:var(--a1);opacity:.32;border-radius:.12em;transform-origin:left center;z-index:-1}
.emo{display:inline-block;margin-left:.12em}
#cardwrap{position:absolute;left:0;right:0;top:590px;height:1000px;perspective:2300px}
#card{position:absolute;left:84px;width:912px;top:0;height:960px;border-radius:44px;background:linear-gradient(165deg,#1b2340 0%,#121931 60%,#0e1428 100%);border:2px solid rgba(255,255,255,.09);padding:30px 34px;transform-style:preserve-3d;overflow:hidden}
.bar{display:flex;align-items:center;gap:12px;font-size:22px;color:#8f9bc0;font-weight:600}
.bar i{width:16px;height:16px;border-radius:50%;display:inline-block}
.bar .fn{margin-left:14px;color:#c6cff0}
.bar .sd{margin-left:auto;font-size:19px;padding:6px 14px;border-radius:20px;background:rgba(255,255,255,.07)}
.ttl{font-size:36px;font-weight:800;margin:22px 0 22px;color:#fff}
#wbody{position:relative;height:730px}
.tabs{position:absolute;left:0;right:0;bottom:0;height:56px;display:flex;gap:6px;padding:0 30px;align-items:flex-end;background:rgba(0,0,0,.25)}

.tabs span.on{background:var(--a1);color:#0b0f1e}
.tile{position:absolute;border-radius:22px;background:#1d2747;border-left:8px solid;padding:20px 22px}
.tile .tl{font-size:22px;color:#9aa6cc;font-weight:600}
.tile .tv{font-size:46px;font-weight:900;margin-top:14px;letter-spacing:-1px}
.row{position:absolute;left:0;right:0;height:84px;border-radius:20px;background:#1d2747;display:flex;align-items:center;padding:0 24px;gap:18px}
.row .av{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:24px;color:#0b0f1e;flex:none}
.row .nm{font-size:29px;font-weight:800}
.row .sb{font-size:20px;color:#9aa6cc;font-weight:600;margin-top:3px}
.pill{padding:10px 20px;border-radius:30px;font-weight:900;font-size:24px;color:#0b0f1e;white-space:nowrap}
.bubble{position:absolute;left:30px;right:30px;border-radius:28px 28px 28px 8px;background:#2b3760;padding:22px 26px;font-size:26px;line-height:1.3;font-weight:600;color:#e8edff}
.blabel{font-size:26px;font-weight:800;display:flex;justify-content:space-between}
.btrack{height:34px;border-radius:17px;background:rgba(255,255,255,.07);margin-top:10px;overflow:hidden}
.bfill{height:100%;border-radius:17px}
.float{position:absolute;padding:20px 30px;border-radius:26px;font-weight:900;font-size:36px;color:#0b0f1e;white-space:nowrap;box-shadow:0 24px 50px rgba(0,0,0,.45)}
.chip{position:absolute;padding:14px 26px;border-radius:40px;font-weight:800;font-size:28px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.18);white-space:nowrap}
.ray{position:absolute;width:10px;height:34px;border-radius:5px}
.conf{position:absolute;width:18px;height:30px;border-radius:4px}
#cta{position:absolute;left:0;right:0;top:0;bottom:0}
.ctaname{position:absolute;left:40px;right:40px;text-align:center;font-weight:900;font-size:118px;line-height:1;letter-spacing:-3px}
.ctasub{position:absolute;left:80px;right:80px;text-align:center;font-weight:700;font-size:40px;color:#d9def5;line-height:1.25}
.ctabtn{position:absolute;left:50%;padding:30px 54px;border-radius:60px;font-weight:900;font-size:46px;color:#0b0f1e;white-space:nowrap}
.cell{position:absolute;border-radius:8px}
.seat{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:#0b0f1e}
.tgl{position:absolute;width:190px;height:76px;border-radius:38px;background:rgba(255,255,255,.1)}
.knob{position:absolute;top:6px;width:90px;height:64px;border-radius:32px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:28px;color:#0b0f1e}
.stamp{position:absolute;padding:8px 18px;border:5px solid;border-radius:14px;font-weight:900;font-size:30px;text-transform:uppercase;letter-spacing:1px}
.sk{height:16px;border-radius:8px;background:rgba(255,255,255,.12)}
.chk{width:40px;height:40px;border-radius:12px;border:3px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:28px;flex:none}
.note{position:absolute;right:30px;bottom:66px;font-size:18px;color:#6f7aa0;font-weight:600}
</style></head>
<body><div id="stage"></div>
<script>
// ---------- helpers ----------
const C={g:'#2ee6a6',r:'#ff5d73',y:'#ffc23d',b:'#5cc8ff',p:'#b18cff',o:'#ff9f43',k:'#ff7aa8',m:'#4dffb5',w:'#e9edff'};
const col=c=>C[c]||c;
const TH={
 landlord:{bg:['#06141f','#0b2f33','#071a26'],a1:'#2ee6a6',a2:'#5cc8ff',a3:'#ffc23d'},
 treasurer:{bg:['#0d0a24','#251454','#120d33'],a1:'#ffc23d',a2:'#b18cff',a3:'#5cc8ff'},
 seat:{bg:['#17071a','#4a1239','#1f0a24'],a1:'#ff7aa8',a2:'#ffd27a',a3:'#b18cff'},
 habit:{bg:['#04170f','#0b3d2c','#062319'],a1:'#4dffb5',a2:'#ffd166',a3:'#5cc8ff'},
 artisan:{bg:['#1a0904','#4a1d0d','#240d06'],a1:'#ffb347',a2:'#ffd700',a3:'#ff7a5c'}
};
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lin=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const spr=(t,t0,k=1)=>{const p=(t-t0)*k; if(p<=0)return 0; return 1-Math.exp(-5.2*p)*Math.cos(10.5*p);};
const back=x=>{const c1=2.2,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
let seed=7; const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};
const el=(tag,cls,par,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;(par||stage).appendChild(e);return e;};
const A=[]; const EV=[]; // anims, sound events
const on=f=>A.push(f);
const ev=(t,type)=>EV.push({t:+t.toFixed(3),type});
let L='fr';
function fmt(v,f){
  if(f==='int')return Math.round(v).toLocaleString(L==='fr'?'fr-CA':'en-CA').replace(/ | /g,' ');
  if(f==='pct')return Math.round(v)+(L==='fr'?' %':'%');
  if(f==='day')return Math.round(v)+(L==='fr'?' j':' d');
  if(f==='cur'||f==='cur0'){const d=f==='cur'?2:0;const s=Math.abs(v).toLocaleString(L==='fr'?'fr-CA':'en-CA',{minimumFractionDigits:d,maximumFractionDigits:d}).replace(/ | /g,' ');const n=v<0?'−':'';return L==='fr'?n+s+' $':n+'$'+s;}
  return String(v);
}
function popStyle(e,t,t0,o={}){const s=spr(t,t0,o.k||1);const base=o.base||'';e.style.opacity=clamp((t-t0)*6);e.style.transform=`${base} scale(${Math.max(0,s)}) rotate(${(1-clamp((t-t0)*2.2))*(o.rot||0)}deg)`;}
function burst(x,y,t0,color,n=12,par){
  const rs=[];for(let i=0;i<n;i++){const r=el('div','ray',par||stage);r.style.background=i%2?color:'#fff';rs.push(r);}
  on(t=>{const p=(t-t0)/0.6;rs.forEach((r,i)=>{if(p<0||p>1){r.style.opacity=0;return;}const a=i/n*Math.PI*2;const d=40+170*eo(p);r.style.opacity=1-p;r.style.left=(x+Math.cos(a)*d-5)+'px';r.style.top=(y+Math.sin(a)*d-17)+'px';r.style.transform=`rotate(${a*180/Math.PI+90}deg) scaleY(${1-p*.6})`;});});
}
// ---------- background ----------
function background(th){
  const bg=el('div','abs',stage);bg.style.inset='0';
  on(t=>{const a=20+t*6;bg.style.background=`linear-gradient(${160+Math.sin(t*.4)*12}deg,${th.bg[0]} 0%,${th.bg[1]} ${50+Math.sin(t*.7)*8}%,${th.bg[2]} 100%)`;});
  const bl=[[th.a1,700,-150,300],[th.a2,640,620,1250],[th.a3,520,820,200]].map(([c,s,x,y],i)=>{const b=el('div','blob');b.style.width=b.style.height=s+'px';b.style.background=`radial-gradient(circle, ${c}55 0%, ${c}22 35%, transparent 70%)`;return {b,x,y,s,i};});
  on(t=>bl.forEach(({b,x,y,i})=>{b.style.left=(x+Math.sin(t*.55+i*2)*140)+'px';b.style.top=(y+Math.cos(t*.45+i)*160)+'px';}));
  const ds=[];for(let i=0;i<46;i++){const d=el('div','dot');const s=4+rnd()*9;d.style.width=d.style.height=s+'px';const c=[th.a1,th.a2,'#ffffff'][i%3];d.style.background=c;d.style.boxShadow=`0 0 ${s*2}px ${c}`;ds.push({d,x:rnd()*1080,y:rnd()*1920,v:20+rnd()*60,ph:rnd()*6});}
  on(t=>ds.forEach(o=>{o.d.style.left=(o.x+Math.sin(t+o.ph)*20)+'px';o.d.style.top=(((o.y-t*o.v)%1920+1920)%1920)+'px';o.d.style.opacity=.25+.55*(.5+.5*Math.sin(t*2+o.ph));}));
}
function logo(par,size,t0,th){
  const s=size;const w=el('div','abs',par);w.style.width=s+'px';w.style.height=s+'px';w.style.position='relative';
  const svg=`<svg width="${s}" height="${s}" viewBox="0 0 100 100"><rect class="b1" x="10" y="60" width="18" height="30" rx="4" fill="${th.a1}"/><rect class="b2" x="40" y="42" width="18" height="48" rx="4" fill="${th.a2}"/><rect class="b3" x="70" y="22" width="18" height="68" rx="4" fill="${th.a1}"/><path class="cv" d="M6 70 Q 45 62 60 34 T 96 8" stroke="#ffd56b" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="140" stroke-dashoffset="140"/></svg>`;
  w.innerHTML=svg;const bs=[...w.querySelectorAll('rect')];const cv=w.querySelector('.cv');
  on(t=>{bs.forEach((b,i)=>{const p=back(clamp((t-t0-i*.1)/.5));b.style.transformOrigin='50% 90%';b.style.transformBox='fill-box';b.style.transform=`scaleY(${Math.max(0,p)})`;});cv.style.strokeDashoffset=140*(1-eo(clamp((t-t0-.35)/.6)));});
  return w;
}
// ---------- widgets ----------
const W={};
W.kpis=(b,d,t0)=>{const cols=d.cols||3,gap=20,tw=(844-gap*(cols-1))/cols,th=d.h||150;
  d.tiles.forEach((x,i)=>{const e=el('div','tile',b);const c=col(x.c);e.style.borderColor=c;e.style.width=tw+'px';e.style.height=th+'px';e.style.left=(i%cols)*(tw+gap)+'px';e.style.top=Math.floor(i/cols)*(th+gap)+'px';e.innerHTML=`<div class="tl">${x.l}</div><div class="tv" style="color:${c}">0</div>`;const v=e.querySelector('.tv');const ti=t0+i*.13;ev(ti,'pop');
    on(t=>{popStyle(e,t,ti);v.textContent=fmt(x.v*eo(lin(t,ti+.1,ti+1.3)),x.f);
      if(d.focus===i){const p=lin(t,t0+3.6,t0+4.1);e.style.boxShadow=`0 0 ${60*p}px ${c}`;e.style.transform+=` scale(${1+.1*back(p)*(p>0?1:0)})`;e.style.zIndex=5;}});});
  if(d.focus!=null)ev(t0+3.6,'ding');};
W.status=(b,d,t0)=>{const rh=d.rh||98;
  d.rows.forEach((x,i)=>{const e=el('div','row',b);e.style.top=i*rh+'px';e.style.height=(rh-14)+'px';const c=col(x.c);
    e.innerHTML=`<div class="av" style="background:${col(x.ac||'p')}">${x.i||x.n[0]}</div><div style="flex:1"><div class="nm">${x.n}</div>${x.s?`<div class="sb">${x.s}</div>`:''}</div>${x.v!=null?`<div class="nm vv" style="color:#c6cff0;margin-right:6px"></div>`:''}<div class="pill" style="background:${c}">${x.st}</div>`;
    const pl=e.querySelector('.pill');const vv=e.querySelector('.vv');const ti=t0+i*.42,tp=ti+.45;ev(ti,'swish');ev(tp,'pop');
    on(t=>{const p=eo(lin(t,ti,ti+.45));e.style.opacity=p;e.style.transform=`translateX(${(1-p)*160}px)`;popStyle(pl,t,tp,{rot:-14});
      if(vv){if(x.cnt){const q=eio(lin(t,ti+.2,ti+1.6));vv.textContent=fmt(x.cnt[0]+(x.cnt[1]-x.cnt[0])*q,x.f||'day');}else vv.textContent=fmt(x.v*eo(lin(t,ti+.2,ti+1.2)),x.f);}});});
  if(d.bubble){const bb=el('div','bubble',b);bb.style.top=(d.rows.length*rh+16)+'px';const tb=t0+d.rows.length*.42+.9;ev(tb,'pop');const txt=d.bubble;
    on(t=>{popStyle(bb,t,tb);const n=Math.floor(clamp((t-tb-.2)/1.6)*txt.length);bb.innerHTML=txt.slice(0,n)+(n<txt.length&&t>tb?'<span style="opacity:.6">▍</span>':'');});}
};
W.bars=(b,d,t0)=>{const rh=d.rh||112;
  d.rows.forEach((x,i)=>{const e=el('div','abs',b);e.style.left='0';e.style.right='0';e.style.top=i*rh+'px';const c=col(x.c);
    e.innerHTML=`<div class="blabel"><span>${x.l}</span><span class="vv" style="color:${c}"></span></div><div class="btrack"><div class="bfill" style="background:linear-gradient(90deg,${c}aa,${c})"></div></div>`;
    const f=e.querySelector('.bfill'),vv=e.querySelector('.vv');const ti=t0+i*.3;ev(ti+.1,'swish');
    on(t=>{const p=eo(lin(t,ti,ti+.4));e.style.opacity=p;e.style.transform=`translateY(${(1-p)*40}px)`;const q=eio(lin(t,ti+.2,ti+1.5));f.style.width=(100*x.v/x.max*q)+'%';vv.textContent=x.vt?x.vt:fmt(x.v*q,x.f)+(x.of?x.of:'');
      if(d.flag===i){const z=lin(t,t0+3.4,t0+3.9);f.style.boxShadow=`0 0 ${40*z}px ${c}`;}});});
  if(d.total){const e=el('div','abs',b);e.style.left='0';e.style.right='0';e.style.top=(d.rows.length*rh+10)+'px';e.style.cssText+='display:flex;justify-content:space-between;align-items:center;padding:22px 26px;border-radius:22px;background:#1d2747';const tt=t0+d.rows.length*.3+.9;ev(tt,'pop');
    e.innerHTML=`<span style="font-size:30px;font-weight:800">${d.total.l}</span><span class="vv" style="font-size:52px;font-weight:900;color:${col(d.total.c||'y')}"></span>`;const vv=e.querySelector('.vv');
    on(t=>{popStyle(e,t,tt);vv.textContent=fmt(d.total.v*eo(lin(t,tt,tt+1.2)),d.total.f);});}
};
W.counter=(b,d,t0)=>{
  const top=el('div','abs',b);top.style.cssText='left:0;right:0;top:0;display:flex;gap:20px';
  const mk=(l,v,c)=>`<div style="flex:1;border-radius:22px;background:#1d2747;padding:18px 22px;border-left:8px solid ${col(c)}"><div class="tl" style="font-size:22px;color:#9aa6cc;font-weight:600">${l}</div><div style="font-size:42px;font-weight:900;margin-top:8px">${fmt(v,'cur')}</div></div>`;
  top.innerHTML=mk(d.a.l,d.a.v,'b')+mk(d.b.l,d.b.v,'p');ev(t0,'pop');on(t=>popStyle(top,t,t0));
  const big=el('div','abs',b);big.style.cssText='left:0;right:0;top:170px;text-align:center';big.innerHTML=`<div style="font-size:26px;color:#9aa6cc;font-weight:700">${d.label}</div><div class="n" style="font-size:120px;font-weight:900;letter-spacing:-3px"></div>`;const n=big.querySelector('.n');
  const t1=t0+.6;ev(t1,'pop');const steps=d.steps;let acc=[d.from];steps.forEach(s=>acc.push(acc[acc.length-1]-s.v));
  steps.forEach((s,i)=>{const r=el('div','row',b);r.style.top=(370+i*76)+'px';r.style.height='68px';r.innerHTML=`<div class="chk">✓</div><div class="nm" style="font-size:26px;flex:1">${s.l}</div><div class="nm" style="font-size:26px;color:#c6cff0">${(s.v>0?'+':'')+fmt(s.v,'cur')}</div>`;const ck=r.querySelector('.chk');const ti=t1+.5+i*.7;ev(ti,'swish');ev(ti+.35,'tick');
    on(t=>{const p=eo(lin(t,ti,ti+.4));r.style.opacity=p;r.style.transform=`translateX(${(1-p)*140}px)`;const q=t>ti+.35;ck.style.background=q?C.g:'transparent';ck.style.borderColor=q?C.g:'rgba(255,255,255,.25)';ck.style.color=q?'#0b0f1e':'transparent';ck.style.transform=`scale(${q?spr(t,ti+.35):1})`;});});
  const tEnd=t1+.5+steps.length*.7+.2;ev(tEnd,'ding');
  on(t=>{popStyle(big,t,t1);let v=d.from;steps.forEach((s,i)=>{const ti=t1+.5+i*.7+.35;v-=s.v*eio(lin(t,ti,ti+.5));});n.textContent=fmt(Math.abs(v)<.005?0:v,'cur');const z=t>tEnd;n.style.color=z?C.g:C.r;n.style.textShadow=z?`0 0 50px ${C.g}`:'none';n.style.transform=`scale(${z?1+.15*Math.max(0,1-(t-tEnd)*2)*Math.abs(Math.sin((t-tEnd)*9)):1})`;});
  if(d.done){const st=el('div','stamp',b);st.textContent=d.done;st.style.cssText+=`left:50%;top:320px;color:${C.g};border-color:${C.g};background:#0e1428`;on(t=>{const p=lin(t,tEnd,tEnd+.25);st.style.opacity=p;st.style.transform=`translate(-50%,0) scale(${2.4-1.4*eo(p)}) rotate(-6deg)`;});}
};
W.calc=(b,d,t0)=>{let y=0;let sum=0;
  d.lines.forEach((x,i)=>{sum+=x.v;const r=el('div','row',b);r.style.top=y+'px';r.style.height='72px';y+=84;r.innerHTML=`<div class="av" style="background:${col(x.c||'o')};width:44px;height:44px;font-size:22px">${x.i||'•'}</div><div class="nm" style="flex:1;font-size:28px">${x.l}</div><div class="nm vv" style="font-size:32px"></div>`;const vv=r.querySelector('.vv');const ti=t0+i*.38;ev(ti,'swish');
    on(t=>{const p=eo(lin(t,ti,ti+.4));r.style.opacity=p;r.style.transform=`translateX(${(1-p)*150}px)`;vv.textContent=fmt(x.v*eo(lin(t,ti+.1,ti+.8)),'cur');});});
  const tt=t0+d.lines.length*.38+.3;const tot=el('div','abs',b);tot.style.cssText=`left:0;right:0;top:${y+6}px;display:flex;justify-content:space-between;padding:0 26px;font-size:30px;font-weight:800;color:#c6cff0`;tot.innerHTML=`<span>${d.total}</span><span class="vv"></span>`;const tv=tot.querySelector('.vv');ev(tt,'pop');
  on(t=>{popStyle(tot,t,tt);tv.textContent=fmt(sum*eo(lin(t,tt,tt+.7)),'cur');});
  const tm=tt+.8;const mg=el('div','abs',b);mg.style.cssText=`left:0;right:0;top:${y+66}px;display:flex;justify-content:space-between;padding:0 26px;font-size:30px;font-weight:800;color:${C.y}`;mg.innerHTML=`<span>${d.margin}</span><span>${fmt(d.pct,'pct')}</span>`;ev(tm,'pop');on(t=>popStyle(mg,t,tm));
  const tr=tm+.8;const price=sum/(1-d.pct/100);const rs=el('div','abs',b);rs.style.cssText=`left:0;right:0;top:${y+130}px;border-radius:28px;padding:24px;text-align:center;background:linear-gradient(135deg,${C.o},${C.y});color:#0b0f1e`;rs.innerHTML=`<div style="font-size:28px;font-weight:800">${d.result}</div><div class="vv" style="font-size:96px;font-weight:900;letter-spacing:-2px;line-height:1"></div>`;const rv=rs.querySelector('.vv');ev(tr,'ding');
  on(t=>{popStyle(rs,t,tr);rv.textContent=fmt(price*eo(lin(t,tr,tr+1)),'cur');});
